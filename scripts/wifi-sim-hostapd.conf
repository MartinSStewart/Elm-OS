# The access point Elm OS runs on a simulated radio (mac80211_hwsim) under QEMU,
# so `make run` and `make test` have a wifi network to join. host/net.c adds the
# interface= and bridge= lines. Its other side is QEMU's virtual Ethernet card, so
# DHCP, DNS and the internet come from QEMU's user-mode network.
driver=nl80211
ssid=Elm OS test network
hw_mode=g
channel=6
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=password
