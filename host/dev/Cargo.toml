[package]
name = "elmos-dev"
version = "0.1.0"
edition = "2021"
publish = false

# The dev runner (`make dev`): runs the Elm program on your own Linux desktop, in a
# window, with a stand-in for the rest of Elm OS. See src/main.rs. Built for the
# build machine, not for Elm OS, so it can depend on a windowing library.
[[bin]]
name = "elmos-dev"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
protocol = { path = "../protocol" }
libc = "0.2"
# A window (X11 or Wayland, their libraries loaded at run time, so building needs no
# headers) and a way to show our pixels in it.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
# Asking a Wayland desktop to leave its shortcuts alone (src/shortcuts.rs), on winit's
# own connection; the versions winit already uses.
wayland-client = { version = "0.31", default-features = false }
wayland-backend = { version = "0.3", default-features = false, features = ["client_system"] }
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "unstable"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
# The same as host/init, whose HTTP, WebSocket, file and stats code this compiles in (main.rs).
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
serde_json = "1"
