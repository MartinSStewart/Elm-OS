[package]
name = "protocol"
version = "0.1.0"
edition = "2021"
publish = false

# The messages between Elm and the host, as Rust types (see src/lib.rs). Its own
# crate, without the eco runtime, so `cargo test -p protocol` runs on the build machine.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
