[package]
name = "protocol"
version = "0.1.0"
edition = "2021"
publish = false

# The messages between Elm and the host, as Rust types (see src/lib.rs). Its own
# crate, without the eco runtime, so `cargo test -p protocol` runs on the build machine.
[dependencies]
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
