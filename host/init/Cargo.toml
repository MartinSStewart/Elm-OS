[package]
name = "elmos-host"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
common = { path = "../common" }
protocol = { path = "../protocol" }
libc = "0.2"
# HTTPS for Elm's requests: rustls (with ring for the crypto) and Mozilla's CA list
# compiled in (webpki-roots), so no OpenSSL and no certificate files. `make refresh`
# updates these with `cargo update`.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# SHA-256 of the boot image for the debug overlay (bootinfo.rs); rustls already uses it.
ring = "0.17"
