name: Tests

# Only pushes to main (a run takes long, so feature branches and pull requests are
# skipped). To test another branch, run it by hand from the Actions tab
# (workflow_dispatch, "Use workflow from"); publishing still happens only on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    # To publish each build on main as a release and move the `deployed` branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools qemu-system-x86 qemu-utils cpio flex bison bc \
            libelf-dev libssl-dev rsync e2fsprogs dosfstools mtools fdisk procps
          # The runner's KVM, so QEMU isn't emulating the CPU (the tests use it if they can).
          sudo chmod 666 /dev/kvm || true

      - name: Install Rust's musl target
        # host/rust-toolchain.toml picks the Rust version; add the target to that one.
        run: cd host && rustup target add x86_64-unknown-linux-musl

      # The caches below are restored and saved as separate steps: actions/cache on its own
      # saves only when the whole job passes, so a run with a failing test kept nothing and
      # the next one built eco (~40 minutes on the runner) again. Each is saved right after
      # the step that fills it.
      - name: Work out eco's cache key
        id: eco-key
        # The same key tools/build-patched-eco.sh gives the build (its .eco-built file and the
        # shared cache's folder name): versions.mk's ECO_ lines, the script and the patches.
        # Kernel or other pin changes in versions.mk don't touch it.
        run: |
          key=$( { grep '^ECO_' versions.mk; cat tools/build-patched-eco.sh; echo "patched=1"
                   for f in tools/eco-patched/*.patch; do basename "$f"; cat "$f"; done; } |
                 sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore eco
        id: eco-cache
        uses: actions/cache/restore@v4
        with:
          # Not its package cache (home/), which is cached on its own below, nor the marker
          # saying eco/system is in ~/.elm (which isn't cached, so the script puts it back).
          path: |
            ~/.cache/elm-os
            !~/.cache/elm-os/*/home
            !~/.cache/elm-os/*/.elm-home-built
          key: eco-${{ steps.eco-key.outputs.key }}

      - name: Build eco
        # make builds the eco versions.mk pins, patched, into ~/.cache/elm-os
        # (tools/build-patched-eco.sh: eco's static release build in Docker), unless the
        # restored one is already that build. On PATH too, for the debugging step below.
        run: |
          bin=$(make -s eco)
          echo "$bin" >> "$GITHUB_PATH"
          built=$(cat "$bin/../.eco-built")
          if [ "$built" != "${{ steps.eco-key.outputs.key }}" ]; then
            echo "::error::eco's key is $built but the workflow worked out ${{ steps.eco-key.outputs.key }}: make 'Work out eco's cache key' match tools/build-patched-eco.sh"
            exit 1
          fi

      - name: Save eco
        if: steps.eco-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/elm-os
            !~/.cache/elm-os/*/home
            !~/.cache/elm-os/*/.elm-home-built
          key: eco-${{ steps.eco-key.outputs.key }}

      - name: Restore Elm packages
        id: packages-cache
        # eco downloads them from GitHub, which is sometimes down: the last good set is
        # kept, and a change to any elm.json starts from it.
        uses: actions/cache/restore@v4
        with:
          # The pinned eco's own package cache (see tools/build-patched-eco.sh).
          path: ~/.cache/elm-os/eco-*/home/.eco/0.2.0/packages
          key: eco-packages-${{ hashFiles('elm/elm.json', 'elm/review/elm.json', 'tools/wire/elm.json') }}
          restore-keys: eco-packages-

      - name: Restore the kernel tree
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: linux
          # versions.mk pins the kernel version, so a new kernel gets a new cache.
          key: linux-${{ hashFiles('versions.mk') }}

      - name: Get the kernel tree
        run: make kernel-src

      - name: Save the kernel tree
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: linux
          key: linux-${{ hashFiles('versions.mk') }}

      - name: Build
        id: build
        run: make

      - name: Tests that don't boot (review, Elm, tools/wire, host protocol)
        run: make check

      - name: Save Elm packages
        # After make check, which fetches elm-review's. Saved even when a test failed, as
        # long as the build got that far.
        if: always() && steps.packages-cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/elm-os/eco-*/home/.eco/0.2.0/packages
          key: eco-packages-${{ hashFiles('elm/elm.json', 'elm/review/elm.json', 'tools/wire/elm.json') }}

      - name: If elm-review's configuration didn't compile, say why
        # elm-review only shows eco's stderr, which is empty when eco dies of a signal.
        if: failure()
        run: |
          cd elm/elm-stuff/generated-code/jfmengels/elm-review/cli/*/build-project/review-project || exit 0
          main=$(grep -o '"[^"]*elm-review/template/src"' elm.json | tr -d '"')/Elm/Review/Main.elm
          eco make --optimize --output=/tmp/review.js "$main"; echo "eco exit status: $?"
          sudo dmesg | tail -20

      - name: Boot in QEMU and check the screen
        run: make test

      - name: Power cuts and restarts keep the Model
        run: make test-persist

      - name: Switching to another build without restarting
        run: make test-switch

      - name: Following the deployed branch (against a stand-in for GitHub)
        run: make test-update

      - name: Publish the build, and move `deployed` to it
        # Only on main, once everything above passed. The release, build-<commit>, has
        # the Elm program and its manifest (tools/release.sh); computers running
        # Elm OS follow `deployed`. A run for an older commit that finishes after a
        # newer one's doesn't move it back.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make release
          tag=build-$(git rev-parse --short=12 HEAD)
          gh release view "$tag" > /dev/null 2>&1 ||
            gh release create "$tag" build/release/elm build/release/manifest.json \
              --target "$GITHUB_SHA" --title "$tag" --prerelease \
              --notes "The Elm program built from $GITHUB_SHA, which passed the tests. See manifest.json."
          git fetch --quiet --unshallow origin || git fetch --quiet origin
          if git push origin "$GITHUB_SHA:refs/heads/deployed"; then
            echo "deployed is now $GITHUB_SHA"
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/deployed; then
            echo "deployed already has a newer commit"
          else
            echo "deployed isn't behind $GITHUB_SHA (was it moved back, to roll back a build?)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/*.png
          if-no-files-found: ignore
