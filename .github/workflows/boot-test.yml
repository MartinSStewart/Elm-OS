name: Tests

# Every push, on every branch (work happens on feature branches, not only in pull
# requests), and by hand from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools qemu-system-x86 qemu-utils cpio flex bison bc \
            libelf-dev libssl-dev rsync e2fsprogs dosfstools mtools fdisk procps
          # The runner's KVM, so QEMU isn't emulating the CPU (the tests use it if they can).
          sudo chmod 666 /dev/kvm || true

      - name: Install Rust's musl target
        # host/rust-toolchain.toml picks the Rust version; add the target to that one.
        run: cd host && rustup target add x86_64-unknown-linux-musl

      - name: Cache eco's bundle
        uses: actions/cache@v4
        with:
          path: eco.tar.gz
          key: eco-0.2.0-rc3

      - name: Install eco
        run: |
          # Downloaded once, then cached. GitHub's release downloads sometimes answer
          # 504 for minutes at a time: retry for up to about 10 minutes, and check it's
          # the bundle tools/build-env/Dockerfile pins.
          [ -s eco.tar.gz ] || curl -fsSL --retry 20 --retry-delay 30 --retry-all-errors -o eco.tar.gz \
            https://github.com/eco-lang/eco-compiler/releases/download/v0.2.0-rc3/eco-0.2.0-rc3-x86_64-linux-musl.tar.gz
          echo "02e2b5f0b27cb4a1d743e572911d2b43a707ab668304fa6cb4e75c06c75508ca  eco.tar.gz" | sha256sum -c
          sudo mkdir -p /opt/eco && sudo tar -xzf eco.tar.gz -C /opt/eco
          echo /opt/eco/bin >> "$GITHUB_PATH"

      - name: Cache Elm packages
        # eco downloads them from GitHub, which is sometimes down: the last good set is
        # kept, and a change to any elm.json starts from it.
        uses: actions/cache@v4
        with:
          path: ~/.eco/0.2.0/packages
          key: eco-packages-${{ hashFiles('elm/elm.json', 'elm/review/elm.json', 'tools/wire/elm.json') }}
          restore-keys: eco-packages-

      - name: Cache the kernel tree
        uses: actions/cache@v4
        with:
          path: linux
          # versions.mk pins the kernel version, so a new kernel gets a new cache.
          key: linux-${{ hashFiles('versions.mk') }}

      - name: Build
        run: |
          make kernel-src
          make

      - name: Tests that don't boot (review, Elm, tools/wire, host protocol)
        run: make check

      - name: Boot in QEMU and check the screen
        run: make test

      - name: Power cuts and restarts keep the Model
        run: make test-persist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/*.png
          if-no-files-found: ignore
