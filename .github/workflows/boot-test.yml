name: Tests

# Only pushes to main (a run takes long, so feature branches and pull requests are
# skipped). To test another branch, run it by hand from the Actions tab
# (workflow_dispatch, "Use workflow from"); publishing still happens only on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    # To publish each build on main as a release and move the `deployed` branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools qemu-system-x86 qemu-utils cpio flex bison bc \
            libelf-dev libssl-dev rsync e2fsprogs dosfstools mtools fdisk procps
          # The runner's KVM, so QEMU isn't emulating the CPU (the tests use it if they can).
          sudo chmod 666 /dev/kvm || true

      - name: Install Rust's musl target
        # host/rust-toolchain.toml picks the Rust version; add the target to that one.
        run: cd host && rustup target add x86_64-unknown-linux-musl

      - name: Cache eco
        # make installs the eco versions.mk pins (tools/install-eco.sh) into ~/.cache/elm-os.
        uses: actions/cache@v4
        with:
          # Not its package cache (home/), which is cached on its own below.
          path: |
            ~/.cache/elm-os
            !~/.cache/elm-os/*/home
          key: eco-${{ hashFiles('versions.mk', 'tools/install-eco.sh') }}

      - name: Install eco
        # Downloaded once, then cached. On PATH too, for the debugging step below.
        run: make -s eco >> "$GITHUB_PATH"

      - name: Cache Elm packages
        # eco downloads them from GitHub, which is sometimes down: the last good set is
        # kept, and a change to any elm.json starts from it.
        uses: actions/cache@v4
        with:
          # The pinned eco's own package cache (see tools/install-eco.sh).
          path: ~/.cache/elm-os/eco-*/home/.eco/0.2.0/packages
          key: eco-packages-${{ hashFiles('elm/elm.json', 'elm/review/elm.json', 'tools/wire/elm.json') }}
          restore-keys: eco-packages-

      - name: Cache the kernel tree
        uses: actions/cache@v4
        with:
          path: linux
          # versions.mk pins the kernel version, so a new kernel gets a new cache.
          key: linux-${{ hashFiles('versions.mk') }}

      - name: Build
        run: |
          make kernel-src
          make

      - name: Tests that don't boot (review, Elm, tools/wire, host protocol)
        run: make check

      - name: If elm-review's configuration didn't compile, say why
        # elm-review only shows eco's stderr, which is empty when eco dies of a signal.
        if: failure()
        run: |
          cd elm/elm-stuff/generated-code/jfmengels/elm-review/cli/*/build-project/review-project || exit 0
          main=$(grep -o '"[^"]*elm-review/template/src"' elm.json | tr -d '"')/Elm/Review/Main.elm
          eco make --optimize --output=/tmp/review.js "$main"; echo "eco exit status: $?"
          sudo dmesg | tail -20

      - name: Boot in QEMU and check the screen
        run: make test

      - name: Power cuts and restarts keep the Model
        run: make test-persist

      - name: Switching to another build without restarting
        run: make test-switch

      - name: Following the deployed branch (against a stand-in for GitHub)
        run: make test-update

      - name: Publish the build, and move `deployed` to it
        # Only on main, once everything above passed. The release, build-<commit>, has
        # the Elm program and its manifest (tools/release.sh); computers running
        # Elm OS follow `deployed`. A run for an older commit that finishes after a
        # newer one's doesn't move it back.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make release
          tag=build-$(git rev-parse --short=12 HEAD)
          gh release view "$tag" > /dev/null 2>&1 ||
            gh release create "$tag" build/release/elm build/release/manifest.json \
              --target "$GITHUB_SHA" --title "$tag" --prerelease \
              --notes "The Elm program built from $GITHUB_SHA, which passed the tests. See manifest.json."
          git fetch --quiet --unshallow origin || git fetch --quiet origin
          if git push origin "$GITHUB_SHA:refs/heads/deployed"; then
            echo "deployed is now $GITHUB_SHA"
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/deployed; then
            echo "deployed already has a newer commit"
          else
            echo "deployed isn't behind $GITHUB_SHA (was it moved back, to roll back a build?)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/*.png
          if-no-files-found: ignore
